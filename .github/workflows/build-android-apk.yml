name: Build HollowTrack APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: artifacts/hollowtrack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: PORT=5173 BASE_PATH=/ pnpm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/hollowtrack-release.jks

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: hollowtrack-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: cd android && ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/HollowTrack-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HollowTrack-Release-APK
          path: artifacts/hollowtrack/android/app/build/outputs/apk/release/HollowTrack-release.apk
