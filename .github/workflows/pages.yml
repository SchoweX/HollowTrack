name: Deploy HollowTrack to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install dependencies
        working-directory: artifacts/hollowtrack
        run: pnpm install --frozen-lockfile

      - name: Build HollowTrack
        working-directory: artifacts/hollowtrack
        env:
          PORT: 5173
          BASE_PATH: /HollowTrack/
        run: pnpm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload HollowTrack
        uses: actions/upload-pages-artifact@v4
        with:
          path: artifacts/hollowtrack/dist/public

      - name: Deploy HollowTrack
        id: deployment
        uses: actions/deploy-pages@v4
